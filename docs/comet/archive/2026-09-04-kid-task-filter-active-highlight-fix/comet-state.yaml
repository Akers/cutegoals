    source: specs/child-page-migration/spec.md
    text: 按分类筛选 - **WHEN** 孩子依次选择「已逾期」「已提交」「已完成」「已取消」 - **THEN**
      列表分别仅展示归类为对应分类的任务，其他分类的任务不出现
    result: passed
    reason:
      text: 四分类各有独立测试且互斥过滤逻辑 TasksPage.tsx:45-76 复查无误
      truncated: false
  - id: A6
    source: specs/child-page-migration/spec.md
    text: 已提交且逾期的任务归入已提交 - **WHEN** 一条非 REPEAT 任务截止时间已过、状态为 SUBMITTED（家长未审核） -
      **THEN** 该任务归入「已提交」，不出现在「已逾期」中
    result: passed
    reason:
      text: overdueTasks 排除 SUBMITTED（TasksPage.tsx:47-49）；测试 409-419
      truncated: false
  - id: A7
    source: specs/child-page-migration/spec.md
    text: 驳回任务归类 - **WHEN** 一条非 REPEAT 任务状态为 REJECTED 且截止时间未过 - **THEN**
      该任务归入「进行中」；若截止时间已过，则归入「已逾期」
    result: passed
    reason:
      text: REJECTED 归类逻辑与测试 471-485
      truncated: false
