      `message`；会话过期（401）跳转对应端登录页；请求携带会话 Cookie 与 `X-CSRF-TOKEN`。
    result: passed
    reason:
      text: SUCCESS/data、message 优先、401 分区跳转、Cookie+X-CSRF-TOKEN 逐项确认
