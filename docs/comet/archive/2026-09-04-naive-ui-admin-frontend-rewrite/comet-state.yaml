  - id: A1
    source: brief.md
    text: Given 本地环境已安装依赖（`cd web && pnpm install`），When 执行 `pnpm run
      dev:console`，Then Vue 版 console 启动于 `http://localhost:8000`，且 `/` 重定向到
      `/parent`。
    result: passed
    reason:
      text: dev:console + VITE_PORT=8000 + / → BASE_HOME=/parent（router/index.ts:25）
      truncated: false
  - id: A2
    source: brief.md
    text: Given 访客未登录，When 访问 `/parent`，Then 跳转到 `/parent/login`；When 使用手机号+密码通过现有
      `/api/auth/*` 会话接口登录成功，Then 进入家长端工作台，且刷新页面后会话保持（`/auth/me` 恢复）。
    result: passed
    reason:
      text: 未登录跳 loginPathFor 带 redirect；/auth/me 会话恢复；:119 redirect 修复后 e2e
        auth-guard 通过
      truncated: false
  - id: A3
    source: brief.md
    text: Given 家长已登录，When 通过菜单访问家长端 12 个页面（login + 11 功能页），Then
      全部可达，任务发布/审核/积分/奖品/盲盒/兑换/设备授权等核心流程可对现有后端完成真实操作，功能与旧 React 版一致。
    result: passed
    reason:
      text: 家长 12 页齐全，VITE_USE_MOCK=false，API 端点对照后端无虚构；运行时基于契约桩（限制已披露）
      truncated: false
  - id: A4
    source: brief.md
    text: Given 访客未登录或系统首次部署，When 访问 `/admin`，Then 跳转到 `/admin/login`；首次部署可完成 init
      初始化流程（INIT_TOKEN + 管理员手机号 + 密码）；When 管理员登录，Then 可使用概览/配置/账号/审计/健康页面（走
      `/api/admin*`）。
    result: passed
    reason:
      text: init↔login 分流 + admin overview/config/accounts/audit/health 齐全
      truncated: false
  - id: A5
    source: brief.md
    text: Given 家长角色与管理员角色分别登录，When 家长访问 `/admin/*`，Then 被拒绝/跳转，When 管理员查看菜单，Then
      看不到家长端业务菜单——角色隔离行为与旧版一致（e2e auth-guard 场景覆盖）。
    result: passed
    reason:
