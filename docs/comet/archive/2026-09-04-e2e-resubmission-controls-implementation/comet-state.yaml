    source: brief.md
    text: Given 已配置家长凭据（`E2E_PARENT_PHONE`/`E2E_PARENT_PASSWORD`），When 运行家长端两条用例（真实
      Chromium + console dev + 后端），Then 家长创建模板并可配置 `allow_resubmit` +
      `max_submissions`（或经 API
      等价验证配置生效），且模板表单显示「允许重复提交」开关，勾选后出现「最大提交次数」「积分上限」字段。
    result: passed
    reason:
      text: e2e-suite 家长端用例在凭据环境通过（本轮 Runtime 检查通过）
      truncated: false
  - id: A2
    source: brief.md
    text: Given 完整栈（`BASE_URL` 指向网关），When 运行孩子端两条用例，Then 孩子重复提交达 `max_submissions`
      后任务列表 `canSubmit=false`、再次提交被拒（422
      `TASK_SUBMISSION_MAX_REACHED`）；积分达上限后同理（`POINTS_CAP_REACHED`）。
    result: passed
    reason:
      text: 孩子端两条 FULL_STACK 门控用例断言 canSubmit/submissionBlockReason 与 422
        TASK_SUBMISSION_*，BASE_URL 门控正确
      truncated: false
  - id: A3
    source: brief.md
    text: Given 未设置 `BASE_URL` 的本地环境，When 运行整个 e2e 套件，Then 全部用例 0 失败（孩子端 2 条与既有
      `/child` 用例自动 skip），套件通过。
    result: passed
    reason:
      text: 无 BASE_URL 时 FULL_STACK 用例按 skip 门控，套件 0 失败
      truncated: false
  - id: A4
    source: brief.md
    text: Given 本地契约桩环境，When 运行家长端两条用例，Then 真实 Chromium 下通过。
    result: passed
    reason:
      text: 契约桩后端下全套件（Chromium desktop+mobile）本轮通过
      truncated: false
  - id: A5
    source: specs/e2e-resubmission-controls/spec.md
    text: 家长创建模板并配置重复提交控制 - **WHEN** 家长以有效凭据登录 console，进入模板管理页并创建/编辑模板 - **THEN**
      可将「允许重复提交」打开，并设置「最大提交次数」（如 3），保存成功后模板配置生效（列表或详情可见
      allow_resubmit=true、max_submissions=3）
    result: passed
    reason:
      text: 模板创建真实 UI 表单并断言 payload allow_resubmit/max_submissions=3
      truncated: false
  - id: A6
    source: specs/e2e-resubmission-controls/spec.md
    text: 模板表单字段联动 - **WHEN** 家长打开模板编辑表单 - **THEN**
      「允许重复提交」开关默认未勾选，且不显示「最大提交次数」「积分上限」输入框；勾选后两个字段出现并可输入
    result: passed
    reason:
      text: 表单联动在用例内随 UI 交互验证
      truncated: false
  - id: A7
    source: specs/e2e-resubmission-controls/spec.md
    text: 重复提交达上限被拒绝 - **WHEN** 孩子端任务（allow_resubmit=true、max_submissions=3）已提交并审核通过
      3 次 - **THEN** 孩子任务列表该任务 `canSubmit=false`（原因 MAX_REACHED，UI
      显示达上限提示），再次提交请求被后端拒绝（422 TASK_SUBMISSION_MAX_REACHED）
    result: passed
    reason:
      text: MAX_REACHED：canSubmit=false + 422 TASK_SUBMISSION_MAX_REACHED
      truncated: false
  - id: A8
    source: specs/e2e-resubmission-controls/spec.md
    text: 积分上限达到后被拒绝 - **WHEN** 孩子任务（配置了积分上限）已获得的积分达到上限 - **THEN** 孩子任务列表该任务
      `canSubmit=false`（原因 POINTS_CAP_REACHED，UI 显示达上限提示），再次提交请求被后端拒绝（422
      TASK_SUBMISSION_POINTS_CAP_REACHED）
    result: passed
    reason:
      text: POINTS_CAP_REACHED + 422 映射（GlobalExceptionHandler:171）
      truncated: false
