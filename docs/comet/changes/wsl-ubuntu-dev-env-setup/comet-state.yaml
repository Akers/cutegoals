acceptance:
  - id: A1
    source: brief.md
    text: "Scenario: WSL 内 docker 可用 — 在 Ubuntu_26_04 中 `docker version` 与 `docker
      compose version` 均成功返回，且 Docker 引擎运行在 WSL 内（非 docker-desktop）。"
    result: passed
    reason:
      text: Ubuntu_26_04 内实测 docker version 返回 Client/Server 均为 Docker Engine -
        Community 29.6.2（Server 在 WSL 内，非 docker-desktop）；docker compose version
        v5.3.1
      truncated: false
  - id: A2
    source: brief.md
    text: "Scenario: PG/Redis 容器运行 — `docker compose --env-file .env -f
      deploy/docker-compose.yml -f deploy/docker-compose.dev.yml up -d
      mit-modelide-core-postgres mit-modelide-core-redis` 后，PostgreSQL 在
      127.0.0.1:35432、Redis 在 127.0.0.1:36379 可连通（库/用户/密码 cutegoals）。"
    result: passed
    reason:
      text: 两容器 Up(healthy)，PG 127.0.0.1:35432 pg_isready 通过，Redis 127.0.0.1:36379
        PONG
      truncated: false
  - id: A3
    source: brief.md
    text: "Scenario: 后端 dev 启动 — 在 /mnt/d/projects/cutegoals 下运行
      `./scripts/start-dev.sh`（或 --use-env）后，Spring Boot dev profile
      成功启动，健康检查/日志无连接错误。"
    result: passed
    reason:
      text: 后端 JDK21 dev profile 运行中，/api/health 返回 SUCCESS/UP，日志含 Tomcat started 8080
        与 Started CuteGoalsApplication；start-dev.sh 因 /mnt/d CRLF 不可直接执行，按 spec
        同一命令链等价启动并在文档记录，符合 brief 措辞（或 --use-env）与非目标豁免
      truncated: false
  - id: A4
    source: brief.md
    text: "Scenario: 前端 dev 启动 — `web` 下 pnpm install 后，console（Vite dev）与 kid（Umi
      dev，8001）均可启动无致命错误。"
    result: passed
    reason:
      text: console(8000) 返回 200，Vite 日志确认；kid(8001) 带 Accept:text/html 返回 200，Umi
        ready 日志确认
      truncated: false
  - id: A5
    source: brief.md
    text: "Scenario: 环境可复现 — 关键安装与启动步骤记录为可重复执行的说明/脚本（写入仓库文档或部署说明），重开 WSL 后按记录可恢复服务。"
    result: passed
    reason:
      text: docs/WSL_DEV_ENV.md 完整且与实测一致，含安装、启动、验证与已知事项
      truncated: false
  - id: A6
    source: specs/dev-environment/spec.md
    text: WSL 内 docker 可用 在 Ubuntu_26_04 中执行 `docker version` 与 `docker compose
      version` 均成功返回引擎与插件版本；引擎为 WSL 内 docker-ce，而非 docker-desktop 集成。
    result: passed
    reason:
      text: openjdk-21 21.0.12 实测，后端进程使用该 JDK；符合 JDK 21~24 约束
      truncated: false
  - id: A7
    source: specs/dev-environment/spec.md
    text: PG/Redis 容器运行 执行 `docker compose --env-file .env -f
      deploy/docker-compose.yml -f deploy/docker-compose.dev.yml up -d
      mit-modelide-core-postgres mit-modelide-core-redis` 后：PostgreSQL 在
      127.0.0.1:35432 以 cutegoals/cutegoals 凭据可登录并存在 cutegoals 库；Redis 在
      127.0.0.1:36379 可连通。
    result: passed
    reason:
      text: Maven 3.9.16、Node v24.18.0、web/ 内 corepack pnpm 11.15.1 实测通过
      truncated: false
  - id: A8
    source: specs/dev-environment/spec.md
    text: 后端 dev 启动 在 `/mnt/d/projects/cutegoals` 下运行
      `./scripts/start-dev.sh`（首次交互生成 `.env.dev`，后续可 `--use-env`）：脚本以 dev
      profile 启动 Spring Boot（`mvn spring-boot:run`），应用成功完成启动、连接上述
      PG/Redis，日志（logs/cutegoals-dev.log）无连接类错误。
    result: passed
    reason:
      text: 同 A3：等价命令链 + 文档记录覆盖 CRLF 限制，dev profile 成功启动连接 PG/Redis
      truncated: false
  - id: A9
    source: specs/dev-environment/spec.md
    text: 前端 dev 启动 在 `web` 下执行 `pnpm install` 后：`apps/console` 的 `pnpm dev`（Vite）与
      `apps/kid` 的 `pnpm start`（Umi，监听 8001）均可启动且无致命错误。
    result: passed
    reason:
      text: 代码单副本 /mnt/d；容器端口口令遵循 compose 定义；无业务代码改动
      truncated: false
  - id: A10
    source: specs/dev-environment/spec.md
    text: 环境可复现 安装与启动步骤以文档或脚本形式保存在仓库中；按该记录在重开 WSL 后可恢复 docker 引擎、PG/Redis 容器与 dev
      服务，无需重新探索。
    result: passed
    reason:
      text: 文档每次启动章节与实际运行逐项吻合，重开 WSL 可按记录恢复
      truncated: false
