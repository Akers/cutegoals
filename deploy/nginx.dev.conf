# =============================================================================
# CuteGoals 2.0 — Nginx 开发配置（HTTP，无前端容器，直接服务本地构建产物）
# 拓扑与生产一致（D1）：
#   /child/api/*  → 白名单过滤（与 kid 容器同一权威文件）→ 后端
#   /child/*      → 本地 kid 构建产物（web/apps/kid/dist 挂载）
#   /api/*        → 后端（console 流量）
#   其余          → 本地 console 构建产物（web/apps/console/dist 挂载）
# 使用前先构建：pnpm --filter @cutegoals/console build && pnpm --filter @cutegoals/kid build
# =============================================================================

upstream backend {
    server cutegoals-core-server:8080;
}

server {
    listen 80;
    server_name _;

    # ── 安全标头 ──────────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── console 构建产物（家长端 + 管理端）────────────────────────────────
    root /usr/share/nginx/console;
    index index.html;

    # ── 孩子端 API 白名单（唯一权威文件：web/apps/kid/nginx-kid-api-whitelist.conf，
    #    由 docker-compose.dev.yml 挂载到 /etc/nginx/conf.d/）────────────────
    include /etc/nginx/includes/kid-api-whitelist.conf;

    # 白名单外的孩子端 API 请求一律 403
    location /child/api/ {
        return 403;
    }

    # ── 孩子端构建产物（/child/ 前缀剥离；^~ 阻止正则 location 抢占）──────
    location ^~ /child/ {
        alias /usr/share/nginx/kid/;
        try_files $uri $uri/ /child/index.html;
    }

    # ── 管理接口不暴露到外部（仅限内部网络）─────────────────────────────
    location /api/admin/ {
        allow   172.16.0.0/12;
        allow   10.0.0.0/8;
        deny    all;

        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── API 反向代理（console 流量 → 后端）────────────────────────────────
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── console SPA 深度链接回退 ─────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源短缓存（umi 产物文件名无内容哈希，不做长缓存）
    location ~* .(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public";
    }
}
