# =============================================================================
# CuteGoals 2.0 — 入口网关 Nginx 配置（Docker Compose 生产环境）
# 拓扑（D1）：唯一对外入口（80/443），按路径分流到两个独立 frontend 容器：
#   /child/api/*  → kid 容器（容器内执行 API 白名单后转发后端）
#   /child/*      → kid 容器（孩子端静态文件）
#   /api/*        → 后端（console 流量；后端 JWT 角色鉴权）
#   其余          → console 容器（家长端 + 管理端静态文件）
# =============================================================================

upstream backend {
    server cutegoals-core-server:8080;
}

upstream console_frontend {
    server cutegoals-core-console:8080;
}

upstream kid_frontend {
    server cutegoals-core-kid:8080;
}

# ── 生产 HTTPS 配置 ────────────────────────────────────────────────────
# 证书文件通过 Docker 卷挂载到 /etc/nginx/ssl/
server {
    listen 443 ssl http2;
    server_name ${APP_DOMAIN};

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ── 孩子端 API（经 kid 容器白名单过滤）────────────────────────────────
    location /child/api/ {
        proxy_pass http://kid_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── 孩子端前端（kid 容器）─────────────────────────────────────────────
    location /child/ {
        proxy_pass http://kid_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── API 反向代理（console 流量 → 后端）────────────────────────────────
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时配置
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── 家长端 + 管理端前端（console 容器）────────────────────────────────
    location / {
        proxy_pass http://console_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── 安全标头（通用，对所有响应生效）────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Content-Security-Policy（根据实际部署域名调整）
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none';" always;
}

# ── HTTP → HTTPS 强制跳转（生产模式） ──────────────────────────────────
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}
