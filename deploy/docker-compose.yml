# =============================================================================
# CuteGoals 2.0 — Docker Compose 编排（生产环境）
# 使用方式：
#   cp deploy/.env.template .env   # 编辑 .env 填入实际值
#   ./deploy/build.sh up            # 或
#   docker compose --env-file .env -f deploy/docker-compose.yml up -d
# =============================================================================

services:
  # ── PostgreSQL 16 ─────────────────────────────────────────────────────────
  cutegoals-core-postgres:
    image: postgres:16-alpine
    container_name: cutegoals-core-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DATABASE:-cutegoals}
      POSTGRES_USER: ${PG_USER:-cutegoals}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      PG_SCHEMA: ${PG_SCHEMA:-cutegoals}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-cutegoals} -d ${PG_DATABASE:-cutegoals}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cutegoals-core-network

  # ── Redis 7 ───────────────────────────────────────────────────────────────
  cutegoals-core-redis:
    image: redis:7-alpine
    container_name: cutegoals-core-redis
    restart: unless-stopped
    environment:
      # redis-cli 自动从该环境变量读取密码，避免暴露在 docker inspect 的 CMD 中
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cutegoals-core-network

  # ── 后端服务：Spring Boot ────────────────────────────────────────────────
  cutegoals-core-server:
    image: cutegoals-core-server:${APP_VERSION:-latest}
    container_name: cutegoals-core-server
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      # PostgreSQL 连接
      PG_HOST: cutegoals-core-postgres
      PG_PORT: 5432
      PG_DATABASE: ${PG_DATABASE:-cutegoals}
      PG_USER: ${PG_USER:-cutegoals}
      PG_PASSWORD: ${PG_PASSWORD}
      PG_SCHEMA: ${PG_SCHEMA:-cutegoals}
      # Redis 连接
      SPRING_DATA_REDIS_HOST: cutegoals-core-redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      # 应用配置
      JWT_SECRET: ${JWT_SECRET}
      CUTEGOALS_JWT_SECRET: ${JWT_SECRET}
      INIT_TOKEN: ${INIT_TOKEN}
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      APP_PRODUCTION: ${APP_PRODUCTION:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # 短信服务（可选）
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      SMS_ACCESS_KEY: ${SMS_ACCESS_KEY:-}
      SMS_ACCESS_SECRET: ${SMS_ACCESS_SECRET:-}
    volumes:
      - server_logs:/app/logs
    depends_on:
      cutegoals-core-postgres:
        condition: service_healthy
      cutegoals-core-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - cutegoals-core-network

  # ── Console 前端容器（家长端 + 管理端，纯静态）─────────────────────────
  cutegoals-core-console:
    image: cutegoals-core-console:${APP_VERSION:-latest}
    container_name: cutegoals-core-console
    build:
      context: ../web
      dockerfile: apps/console/Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - cutegoals-core-network

  # ── Kid 前端容器（孩子端，静态 + /child/api 白名单反代）─────────────────
  cutegoals-core-kid:
    image: cutegoals-core-kid:${APP_VERSION:-latest}
    container_name: cutegoals-core-kid
    build:
      context: ../web
      dockerfile: apps/kid/Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    depends_on:
      cutegoals-core-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - cutegoals-core-network

  # ── 入口网关 Nginx（按路径分流到 console / kid / 后端）─────────────────
  cutegoals-core-nginx:
    image: cutegoals-core-nginx:${APP_VERSION:-latest}
    container_name: cutegoals-core-nginx
    build:
      context: ..
      dockerfile: deploy/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      cutegoals-core-server:
        condition: service_healthy
      cutegoals-core-console:
        condition: service_healthy
      cutegoals-core-kid:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - cutegoals-core-network

  # ── 备份 Sidecar ──────────────────────────────────────────────────────────
  cutegoals-core-backup:
    image: postgres:16-alpine
    container_name: cutegoals-core-backup
    restart: unless-stopped
    environment:
      PG_HOST: cutegoals-core-postgres
      PG_PORT: 5432
      PG_DATABASE: ${PG_DATABASE:-cutegoals}
      PG_USER: ${PG_USER:-cutegoals}
      PG_PASSWORD: ${PG_PASSWORD}
      PG_SCHEMA: ${PG_SCHEMA:-cutegoals}
      BACKUP_DIR: ${BACKUP_DIR:-/backup}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_RETENTION_WEEKS: ${BACKUP_RETENTION_WEEKS:-4}
      BACKUP_RETENTION_MONTHS: ${BACKUP_RETENTION_MONTHS:-3}
      APP_VERSION: ${APP_VERSION:-latest}
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      SERVER_URL: http://cutegoals-core-server:8080
    volumes:
      - backup_data:/backup
      - ./backup/backup.sh:/usr/local/bin/backup.sh:ro
      - ./backup/prune.sh:/usr/local/bin/prune.sh:ro
    depends_on:
      cutegoals-core-postgres:
        condition: service_healthy
      cutegoals-core-server:
        condition: service_healthy
    entrypoint: >
      sh -c "
        echo 'backup-sidecar ready' &&
        echo '0 2 * * * /usr/local/bin/backup.sh >> /var/log/backup.log 2>&1' | crontab - &&
        crond -f -l 2
      "
    networks:
      - cutegoals-core-network

volumes:
  pg_data:
    name: cutegoals-core-pg-data
  redis_data:
    name: cutegoals-core-redis-data
  backup_data:
    name: cutegoals-core-backup-data
  server_logs:
    name: cutegoals-core-server-logs

networks:
  cutegoals-core-network:
    name: cutegoals-core-network
    driver: bridge
