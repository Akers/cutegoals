# =============================================================================
# 孩子端 API 白名单（D2）—— 唯一权威来源
# 使用方：kid 前端容器（apps/kid/nginx.conf include）与开发网关（docker-compose.dev.yml 挂载）。
# 规则：前缀 location + proxy_pass 剥离 /child 前缀转发后端；最长前缀匹配优先，
#       未命中者由使用方的 location /child/api/ { return 403; } 兜底。
# 维护：新增孩子端功能调用新端点时，MUST 同步在此添加白名单条目。
# =============================================================================

# 认证（孩子登录）
location /child/api/auth/child/login {
    include /etc/nginx/includes/api-proxy-headers.conf;
    proxy_pass http://backend/api/auth/child/login;
}

# 认证（登出）
location /child/api/auth/logout {
    include /etc/nginx/includes/api-proxy-headers.conf;
    proxy_pass http://backend/api/auth/logout;
}

# 认证（会话查询）
location /child/api/auth/me {
    include /etc/nginx/includes/api-proxy-headers.conf;
    proxy_pass http://backend/api/auth/me;
}

# 设备绑定（查询设备下可登录的孩子档案）
location /child/api/family/devices/children {
    include /etc/nginx/includes/api-proxy-headers.conf;
    proxy_pass http://backend/api/family/devices/children;
}

# 任务列表（孩子只读）
location /child/api/task-assignments {
    include /etc/nginx/includes/api-proxy-headers.conf;
    proxy_pass http://backend/api/task-assignments;
}

# 积分余额
location /child/api/points/balance {
    include /etc/nginx/includes/api-proxy-headers.conf;
    proxy_pass http://backend/api/points/balance;
}

# 奖品（孩子只读列表）
location /child/api/prizes {
    include /etc/nginx/includes/api-proxy-headers.conf;
    proxy_pass http://backend/api/prizes;
}

# 盲盒（可用列表 / 候选概率）
location /child/api/blind-boxes {
    include /etc/nginx/includes/api-proxy-headers.conf;
    proxy_pass http://backend/api/blind-boxes;
}

# 兑换（记录查询 / 直接兑换 / 盲盒兑换）
location /child/api/exchanges {
    include /etc/nginx/includes/api-proxy-headers.conf;
    proxy_pass http://backend/api/exchanges;
}

# 任务提交
location /child/api/task-review/submissions {
    include /etc/nginx/includes/api-proxy-headers.conf;
    proxy_pass http://backend/api/task-review/submissions;
}
