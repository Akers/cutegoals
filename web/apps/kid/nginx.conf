# CuteGoals Kid 前端容器（孩子端）—— 静态服务 + /child/api 白名单反代
# 权限隔离（D2）：孩子端 API 流量必经本容器，仅白名单端点转发后端，其余 403。

upstream backend {
    server mit-modelide-core-server:8080;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 安全标头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 健康检查
    location = /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # ── 孩子端 API 白名单（前缀匹配，最长匹配优先于下方 403 兜底）─────────
    include /etc/nginx/includes/kid-api-whitelist.conf;

    # 白名单外的 API 请求一律 403，不触达后端
    location /child/api/ {
        return 403;
    }

    # ── 孩子端静态文件（/child/ 前缀剥离；^~ 阻止正则 location 抢占）────
    location ^~ /child/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /child/index.html;
        # 静态资源短缓存（umi 产物文件名无内容哈希，不做长缓存）
        expires 1h;
        add_header Cache-Control "public";
    }

    # 容器内直达根路径的便捷跳转
    location = / {
        return 302 /child/;
    }
}
